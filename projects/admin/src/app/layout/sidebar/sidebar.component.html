<!-- Same layout as the shop admin sidebar (MySkin admin core/layout/sidebar) -->
<aside class="sidebar" [class.mobile-open]="open">
  <div class="sidebar-brand">
    <a class="brand-logo" routerLink="/platform" (click)="navigate.emit()">
      <div class="brand-text">
        <span class="brand-word">Platform</span>
        <span class="brand-tagline">Commerce control</span>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav" aria-label="Platform navigation">
    <ng-container *ngFor="let section of primarySections">
      <div class="nav-section-label">{{ section.label }}</div>
      <ng-container *ngFor="let item of section.items">
        <a
          *ngIf="!item.disabled && canSee(item)"
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }"
          [title]="item.label"
          (click)="navigate.emit()"
        >
          <span class="nav-icon"><svg width="16" height="16" aria-hidden="true"><use [attr.href]="'#icon-' + item.icon"></use></svg></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-container>
  </nav>

  <nav class="sidebar-nav sidebar-nav-admin" aria-label="Administration">
    <ng-container *ngFor="let section of adminSections">
      <div class="nav-section-label">{{ section.label }}</div>
      <ng-container *ngFor="let item of section.items">
        <a
          *ngIf="!item.disabled && canSee(item)"
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }"
          [title]="item.label"
          (click)="navigate.emit()"
        >
          <span class="nav-icon"><svg width="16" height="16" aria-hidden="true"><use [attr.href]="'#icon-' + item.icon"></use></svg></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-container>
  </nav>

  <div class="sidebar-foot">
    <span class="env-dot"></span>
    <span>Local environment</span>
    <small>Super Admin</small>
  </div>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
    </symbol>
    <symbol id="icon-building" viewBox="0 0 24 24">
      <path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M19 13h.01M19 17h.01M2 21h20" />
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v8M8 12h8" />
    </symbol>
    <symbol id="icon-puzzle" viewBox="0 0 24 24">
      <path d="M19 13h-2.2a2.8 2.8 0 1 1 0-2H19a1 1 0 0 1 1 1v3.5a1.5 1.5 0 0 1-1.5 1.5H15v2.5a1.5 1.5 0 0 1-1.5 1.5H10v-2.2a2.8 2.8 0 1 1-2 0V19H4.5A1.5 1.5 0 0 1 3 17.5V14h2.2a2.8 2.8 0 1 1 0-2H3V8.5A1.5 1.5 0 0 1 4.5 7H8v2.2a2.8 2.8 0 1 1 2 0V7h3.5A1.5 1.5 0 0 1 15 8.5V11h3.5a1.5 1.5 0 0 1 1.5 1.5V13Z" />
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3.5" />
      <path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.5a5.5 5.5 0 0 1 4 5.5" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 3 20 6v6c0 4.6-3.2 7.6-8 9-4.8-1.4-8-4.4-8-9V6l8-3Z" />
      <path d="m9 12 2 2 4-4" />
    </symbol>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <circle cx="8" cy="15" r="4" />
      <path d="m11 12 7-7M15 4l3 3M13 6l3 3" />
    </symbol>
  </svg>
</aside>
