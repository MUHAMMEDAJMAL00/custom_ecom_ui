<div class="page-wrap">
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-title-main">Settings</div>
      <div class="page-breadcrumb"><a [routerLink]="'/dashboard' | shopUrl">Dashboard</a><span class="sep">›</span><span class="current">Settings</span></div>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-outline" title="Reload settings" (click)="load()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.36-3.36L23 10M1 14l5.13 4.36A9 9 0 0020.49 15"/></svg>
        Reload
      </button>
    </div>
  </div>

  <div class="settings-grid">

    <!-- General -->
    <div class="card settings-card">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;opacity:.7"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
          General
        </span>
      </div>
      <div class="card-body">
        <div class="settings-row" *ngFor="let row of configRows">
          <div class="settings-row-label">
            <div class="settings-row-title">{{ row.label }}</div>
            <div class="settings-row-hint">{{ row.hint }}</div>
          </div>
          <div class="settings-row-control">
            <textarea *ngIf="row.type === 'text'" class="form-control" rows="2" [(ngModel)]="values[row.key]" [placeholder]="'Enter ' + row.label"></textarea>
            <input *ngIf="row.type !== 'text'" [type]="row.type === 'number' ? 'number' : 'text'" class="form-control" [(ngModel)]="values[row.key]" [placeholder]="'Enter ' + row.label" [style.maxWidth]="row.type === 'number' ? '120px' : ''" />
          </div>
          <div class="settings-row-action">
            <button class="btn btn-primary btn-sm" [disabled]="saving[row.key]" (click)="saveRow(row.key, row.type)">{{ savedText[row.key] || (saving[row.key] ? 'Saving…' : 'Save') }}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Invoice -->
    <div class="card settings-card">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;opacity:.7"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Invoice
        </span>
      </div>
      <div class="card-body">
        <div class="settings-row" *ngFor="let row of invoiceRows">
          <div class="settings-row-label">
            <div class="settings-row-title">{{ row.label }}</div>
            <div class="settings-row-hint">{{ row.hint }}</div>
          </div>
          <div class="settings-row-control">
            <textarea *ngIf="row.type === 'text'" class="form-control" rows="2" [(ngModel)]="values[row.key]" [placeholder]="'Enter ' + row.label"></textarea>
            <input *ngIf="row.type !== 'text'" type="text" class="form-control" [(ngModel)]="values[row.key]" [placeholder]="'Enter ' + row.label" />
          </div>
          <div class="settings-row-action">
            <button class="btn btn-primary btn-sm" [disabled]="saving[row.key]" (click)="saveRow(row.key, row.type)">{{ savedText[row.key] || (saving[row.key] ? 'Saving…' : 'Save') }}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tax & Loyalty -->
    <div class="card settings-card">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;opacity:.7"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          Tax &amp; Loyalty
        </span>
      </div>
      <div class="card-body">
        <div class="settings-row" *ngFor="let row of taxRows">
          <div class="settings-row-label">
            <div class="settings-row-title">{{ row.label }}</div>
            <div class="settings-row-hint">{{ row.hint }}</div>
          </div>
          <div class="settings-row-control">
            <input type="number" class="form-control" [(ngModel)]="values[row.key]" style="max-width:120px" />
          </div>
          <div class="settings-row-action">
            <button class="btn btn-primary btn-sm" [disabled]="saving[row.key]" (click)="saveRow(row.key, row.type)">{{ savedText[row.key] || (saving[row.key] ? 'Saving…' : 'Save') }}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Inventory -->
    <div class="card settings-card">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;opacity:.7"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Inventory
        </span>
      </div>
      <div class="card-body">
        <div class="settings-row" *ngFor="let row of inventoryRows">
          <div class="settings-row-label">
            <div class="settings-row-title">{{ row.label }}</div>
            <div class="settings-row-hint">{{ row.hint }}</div>
          </div>
          <div class="settings-row-control">
            <input type="number" class="form-control" [(ngModel)]="values[row.key]" style="max-width:120px" />
          </div>
          <div class="settings-row-action">
            <button class="btn btn-primary btn-sm" [disabled]="saving[row.key]" (click)="saveRow(row.key, row.type)">{{ savedText[row.key] || (saving[row.key] ? 'Saving…' : 'Save') }}</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
